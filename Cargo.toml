[package]
name = "flashcards"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 'z'
codegen-units = 1
lto = true

[dependencies]
anyhow = "1.0.104"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
leptos = { version = "0.8", features = ["csr", "nightly"] }
log = "0.4.35"
rand = "0.10.3"
wasm-bindgen = "0.2.93"
web-sys = { version = "0.3.107", features = [
    "DomRect",
    "Element",
    # "IdbDatabase",
    # "IdbFactory",
    # "IdbOpenDbRequest",
    "Storage",
    "Window",
] }
# gloo-timers = { version = "0.3.0", features = ["futures"] }
# web-sys = { version = "0.3", features = [
#     "HtmlInputElement",
#     "FileList",
#     # "File",
#     # "FileReader",
# ] }
# gloo-file = { version = "0.3.0", features = ["futures"] }

[dev-dependencies]
wasm-bindgen = "0.2.93"
wasm-bindgen-test = "0.3.42"
