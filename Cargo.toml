[package]
name = "flashcards"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 'z'
codegen-units = 1
lto = true

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
leptos = { version = "0.8", features = ["csr", "nightly"] }
log = "0.4.35"
